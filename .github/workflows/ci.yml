# Integración continua: cada push a main y cada Pull Request deben pasar
# lint, pruebas, build y auditoría de dependencias de producción.
# CodeQL ya está activo con "default setup" en el repositorio (no se duplica aquí).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo necesita leer el código
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # El build valida que exista (rewrites hacia la API). No es un secreto
      # ni una URL de producción: solo hace falta que sea una URL http(s).
      API_PROXY_TARGET: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
